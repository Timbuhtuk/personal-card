<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Record entrance studies — Timbuhtuk</title>
    <link rel="stylesheet" href="assets/styles/fonts.css">
    <link rel="stylesheet" href="record-entrance-lab.css">
    <script src="record-entrance-lab.js" defer></script>
</head>
<body>
    <header class="entrance-studies">
        <div class="study-top"><span>RECORD / ENTRANCE</span><div class="study-actions"><button type="button" id="slow" aria-pressed="false">Slow ×0.5</button><button type="button" id="replay">Replay ↻</button></div></div>
        <nav aria-label="Record entrance style">
            <button type="button" data-entrance="cue" aria-pressed="true"><small>01</small> Cue</button>
            <button type="button" data-entrance="spin" aria-pressed="false"><small>02</small> Spin-up</button>
            <button type="button" data-entrance="roll" aria-pressed="false"><small>03</small> Roll-in</button>
            <button type="button" data-entrance="trace" aria-pressed="false"><small>04</small> Groove trace</button>
            <button type="button" data-entrance="camera" aria-pressed="false"><small>05</small> Pull back</button>
            <button type="button" data-entrance="scan" aria-pressed="false"><small>06</small> Scan</button>
        </nav>
        <p id="study-description" aria-live="polite">A restrained turn with the needle gently following.</p>
    </header>
    <main><iframe id="site-preview" title="Live Home to About transition"></iframe></main>
</body>
</html>
