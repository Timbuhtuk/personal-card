<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tessera — saved pier card</title><link rel="stylesheet" href="assets/styles/fonts.css"><link rel="stylesheet" href="assets/styles/tokens.css"><style>:root { color-scheme: dark; --canvas: #0c0c0c; --text: #eeeeee; --secondary: #a4a4a4; --border: #343434; }
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
html { min-width: 0; scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--text); font-family: 'Cascadia Code', monospace; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
a:focus-visible { outline: 1px solid var(--text); outline-offset: 7px; }
main { max-width: 1720px; width: 91%; margin: auto; padding-bottom: 32px; }
.work-intro { display: grid; grid-template-columns: 5.6% minmax(0,1fr) 18% 22px; align-items: center; gap: 16px; padding: 60px 0 42px; }
.intro-copy { grid-column: 1 / 3; min-width: 0; }
.work-home { grid-column: 3 / 5; justify-self: end; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 0; font-size: 12px; font-weight: 400; }
.work-home-label { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.work-home-arrow { font-family: sans-serif; font-size: 14px; font-weight: 300; }
h1 { font-family: 'Science Gothic', sans-serif; font-size: clamp(42px, 6.7vw, 100px); letter-spacing: -.065em; line-height: 1.1; margin: 0; font-weight: 600; }
.project-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid #818181; }
.project { min-height: 110px; display: grid; grid-template-columns: 5.6% minmax(0,1fr) 18% 22px; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); position: relative; transition: color .25s, opacity .25s; }
.project-number { font-size: 10px; color: #8d8d8d; align-self: center; }
.project-name { padding: 22px 0; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.project-name h2 { font-family: 'Science Gothic', sans-serif; font-size: clamp(22px, 2.7vw, 46px); font-weight: 500; letter-spacing: -.055em; margin: 0; line-height: 1.22; }
.project-stack { display: flex; justify-content: flex-end; align-items: center; gap: 13px; }
.project-stack img { display: block; width: 26px; height: 26px; object-fit: contain; filter: invert(1) brightness(.82); }
.project-stack .project-tech--wide { width: 34px; }
.project-arrow { font-family: sans-serif; font-size: 22px; font-weight: 300; text-align: right; transition: transform .25s; }
.inline-preview { display: none; }
.project-preview { position: fixed; left: 0; top: 0; width: clamp(300px, 31vw, 460px); z-index: 8; pointer-events: none; background: #171717; border: 1px solid #5a5a5a; box-shadow: 0 20px 70px #0009; opacity: 0; visibility: hidden; will-change: transform; transition: opacity .2s, visibility .2s; transform-origin: 50% 65%; }
.project-preview.visible { visibility: visible; opacity: 1; }
.preview-art { position: relative; aspect-ratio: 1.5; overflow: hidden; background: #161616; }
.preview-art > [data-image] { position: absolute; width: 100%; height: 100%; inset: 0; object-fit: cover; opacity: 0; transform: scale(1.035); transition: opacity .22s, transform .45s cubic-bezier(.2,.8,.2,1); }
.preview-art > [data-image].active { opacity: 1; transform: scale(1); }
.project-preview[data-project="tessera"] { width: clamp(380px, 41vw, 580px); }
.tessera-inline { aspect-ratio: 1.5; overflow: hidden; }
.tessera-fallback { display: block; width: 100%; height: 100%; object-fit: cover; }
.tessera-scene { position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden; background: #121114; }
.tessera-artwork { position: absolute; inset: 0; width: 100%; height: 100%; transform: scale(1.025); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.tessera-artwork img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.tessera-monochrome { clip-path: polygon(0 0, 72% 0, 42% 100%, 0 100%); }
.preview-scene:not(.active) .tessera-artwork { transform: scale(1.11); }
.tessera-shade { position: absolute; inset: 0; background: linear-gradient(90deg, #121114eb, #121114a0 24%, #12111430 57%, transparent 82%), linear-gradient(180deg, #12111450, transparent 38%, #12111470); }
.tessera-wordmark { position: absolute; left: 6%; top: 9%; display: flex; align-items: center; gap: 10px; color: #f2f2f2; font-size: clamp(22px, 2.8vw, 40px); font-weight: 700; letter-spacing: -.07em; }
.tessera-wordmark img { width: 1em; height: 1em; object-fit: contain; }
.tessera-shot { border-color: #6a666c; background: #111; }
.tessera-shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
.project-preview[data-project="sonar"] { width: clamp(380px, 41vw, 580px); }
.sonar-inline { aspect-ratio: 1.5; overflow: hidden; }
.sonar-fallback { display: block; width: 100%; height: 100%; object-fit: cover; }
.sonar-scene { position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 87% 45%, #313652 0, #1b1d28 30%, #0b0b0f 70%); }
.sonar-orbit { position: absolute; width: 83%; aspect-ratio: 1; border: 1px solid #ffffff12; border-radius: 50%; left: 29%; top: 0; box-shadow: 0 0 0 22px #ffffff04, 0 0 0 44px #ffffff03, 0 0 0 66px #ffffff02; }
.sonar-wordmark { position: absolute; left: 6%; top: 9%; width: 35%; aspect-ratio: 304 / 78; overflow: hidden; mix-blend-mode: screen; }
.sonar-wordmark img { position: absolute; max-width: none; width: 258.22%; height: auto; left: -79.93%; top: -239.74%; }
.sonar-screen { position: absolute; width: 27%; aspect-ratio: 370 / 771; padding: 3px; border: 1px solid #62626d; border-radius: 13px; background: #060609; box-shadow: 0 14px 26px #000a; overflow: hidden; transition: transform .7s cubic-bezier(.16,1,.3,1), opacity .45s; }
.sonar-screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 9px; }
.sonar-screen--search { left: 39%; top: 18%; transform: rotate(-2deg); transition-delay: .06s; z-index: 1; }
.sonar-screen--home { left: 12%; top: 36%; transform: rotate(-12deg); transition-delay: .13s; z-index: 2; }
.sonar-screen--favorites { left: 66%; top: 33%; transform: rotate(11deg); transition-delay: .2s; z-index: 3; }
.preview-scene:not(.active) .sonar-screen { transform: translateY(25%) rotate(0deg) scale(.92); opacity: 0; transition-delay: 0s; }
.sonar-scene::after { content: ''; position: absolute; bottom: 0; inset-inline: 0; height: 20%; z-index: 4; background: linear-gradient(transparent, #09090e); pointer-events: none; }
.project-preview[data-project="btw"] { width: clamp(380px, 41vw, 580px); }
.btw-inline { aspect-ratio: 1.5; overflow: hidden; }
.btw-fallback { display: block; width: 100%; height: 100%; object-fit: cover; }
.btw-scene { position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden; background: #4d4a31; }
.btw-gameplay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 51% center; transform: scale(1.025); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.preview-scene:not(.active) .btw-gameplay { transform: scale(1.11); }
.btw-shade { position: absolute; inset: 0; background: linear-gradient(180deg, #1e251de0, #1b241a65 24%, transparent 49%, #171b1750 67%, #101510ee); }
.btw-title { position: absolute; left: 6%; top: 9%; font-family: 'Science Gothic', sans-serif; font-weight: 600; font-size: clamp(17px, 2.1vw, 31px); line-height: 1.05; letter-spacing: -.045em; color: #f4efde; }
.preview-shot { position: absolute; left: 10%; bottom: 8%; width: 38%; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid #b4c1b28c; background: #172129; box-shadow: 0 10px 25px #10161080; transform: rotate(5deg); transition: transform .75s cubic-bezier(.16,1,.3,1), opacity .45s; transition-delay: .17s; z-index: 2; }
.preview-shot--back { left: 5%; bottom: 27%; transform: rotate(-6deg); transition-delay: .1s; z-index: 1; }
.preview-scene:not(.active) .preview-shot--front { transform: translate(-16%, 45%) rotate(-10deg); opacity: 0; transition-delay: 0s; }
.preview-scene:not(.active) .preview-shot--back { transform: translate(-7%, 32%) rotate(1deg); opacity: 0; transition-delay: 0s; }
.btw-shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.btw-shot.preview-shot--back img { object-position: left center; }
.project-preview[data-project="sidequest"] { width: clamp(380px, 41vw, 580px); }
.sidequest-inline { aspect-ratio: 1.5; overflow: hidden; }
.sidequest-fallback { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.sidequest-scene { position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden; background: #10120e; }
.sidequest-home { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left top; transform: scale(1.025); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.preview-scene:not(.active) .sidequest-home { transform: scale(1.11); }
.sidequest-shade { position: absolute; inset: 0; background: linear-gradient(180deg, #10120ee0, #10120e22 35%, #10120e44 80%, #10120ec0); }
.sidequest-library { border-color: #70706a; background: #171717; }
.sidequest-map { border-color: #ae9a59; background: #10150d; }
.sidequest-wordmark { position: absolute; left: 6%; top: 9%; width: 57%; aspect-ratio: 215 / 36; overflow: hidden; mix-blend-mode: screen; }
.sidequest-wordmark img { position: absolute; width: 595.35%; height: auto; max-width: none; left: -28.84%; top: -66.67%; filter: grayscale(1) contrast(2); }
.sidequest-library img { position: absolute; width: 219.93%; height: auto; max-width: none; left: -111.34%; top: -38.76%; }
.sidequest-map img { position: absolute; width: 188.79%; height: auto; max-width: none; left: -38.79%; top: 0; }
@media (hover: hover) and (pointer: fine) {
    .project-list.is-exploring .project:not(.active) { opacity: .38; }
    .project.active .project-name { transform: translateX(13px); }
    .project.active .project-arrow { transform: translate(4px,-4px); }
    .project.active .project-number { color: var(--text); }
}
@media (min-width: 1800px) {
    .work-intro { padding-top: 100px; padding-bottom: 90px; }
    .project { min-height: 132px; }
}
@media (max-width: 1000px) {
    .work-intro { grid-template-columns: 32px minmax(0,1fr) 82px 22px; gap: 12px; }
    .project { grid-template-columns: 32px minmax(0,1fr) 82px 22px; gap: 12px; }
    .project-stack { gap: 10px; }
    .project-stack img { width: 22px; height: 22px; }
    .project-stack .project-tech--wide { width: 30px; }
}
@media (max-width: 650px), (hover: none), (pointer: coarse) {
    main { width: 88%; }
    .work-intro { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 50px 0 37px; }
    h1 { font-size: clamp(21px, 6.3vw, 36px); }
    .work-home { flex: none; min-height: 44px; padding: 10px 0; gap: 7px; font-size: 11px; }
    .work-home-arrow { font-size: 13px; }
    .project { grid-template-columns: 22px minmax(0,1fr) 20px; gap: 0 10px; padding: 23px 0; }
    .project-name { padding: 0; }
    .project-name h2 { font-size: clamp(22px, 5.3vw, 36px); }
    .project-number { align-self: start; margin-top: 7px; font-size: 8px; }
    .project-stack { grid-column: 2 / 4; grid-row: 2; justify-content: flex-start; margin: 12px 0 18px; }
    .project-arrow { grid-column: 3; grid-row: 1; align-self: start; margin-top: 2px; font-size: 20px; }
    .inline-preview { display: block; grid-column: 2 / 4; grid-row: 3; width: 100%; height: auto; border: 1px solid var(--border); }
    .project-preview { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
}
