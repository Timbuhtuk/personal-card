<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0c0c">
    <meta name="description" content="Selected software projects by Timbuhtuk — an interactive work index.">
    <title>Selected work — Timbuhtuk</title>
    <link rel="preload" href="assets/fonts/science-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/styles/fonts.css">
    <link rel="stylesheet" href="work-lab.css">
    <link rel="stylesheet" href="text-links.css">
    <link rel="stylesheet" href="signal-cursor.css">
    <script src="work-lab.js" defer></script>
    <script src="signal-cursor.js" defer></script>
</head>
<body>
    <main id="work">
        <section class="work-intro" aria-labelledby="work-title">
            <div class="intro-copy"><h1 id="work-title">What I’ve built</h1></div>
            <a class="work-home" href="./" target="_top"><span class="work-home-label text-link">Home</span><span class="work-home-arrow" aria-hidden="true">↗</span></a>
        </section>
        <ol class="project-list" aria-label="Selected projects">
            <li><a class="project" href="https://github.com/Timbuhtuk/TESSERA" target="_blank" rel="noopener noreferrer" data-project="tessera" aria-label="Tessera — pixel art tools. Open GitHub in a new tab.">
                <span class="project-number">01</span><div class="project-name"><h2>Tessera</h2></div><span class="project-stack" role="img" aria-label="C# / WPF" title="C# / WPF"><img src="assets/technology-logos/svg/csharp.svg" alt="" title="C#" width="26" height="26" draggable="false"><img src="assets/technology-logos/svg/wpf-unofficial.svg" alt="" title="WPF" width="26" height="26" draggable="false" class="project-tech--wide"></span><span class="project-arrow" aria-hidden="true">↗</span>
                <div class="inline-preview tessera-inline" data-tessera-mount role="img" aria-label="Tessera: monochrome original mural on the left and color pixel art result on the right, with actual editor screens in dark and light themes"><img class="tessera-fallback" src="assets/work/tessera/editor-color.png" alt="Tessera pixel art editor" width="1220" height="880" draggable="false"></div>
            </a></li>
            <li><a class="project" href="https://github.com/sonar-diplomat" target="_blank" rel="noopener noreferrer" data-project="sonar" aria-label="Sonar — music platform. Open GitHub in a new tab.">
                <span class="project-number">02</span><div class="project-name"><h2>Sonar</h2></div><span class="project-stack" role="img" aria-label="C# / React / gRPC" title="C# / React / gRPC"><img src="assets/technology-logos/svg/csharp.svg" alt="" title="C#" width="26" height="26" draggable="false"><img src="assets/technology-logos/svg/react.svg" alt="" title="React" width="26" height="26" draggable="false"></span><span class="project-arrow" aria-hidden="true">↗</span>
                <div class="inline-preview sonar-inline" data-sonar-mount role="img" aria-label="Sonar app: actual home, search and favorites screens"><img class="sonar-fallback" src="assets/work/sonar/brand.png" alt="Sonar" width="785" height="438" draggable="false"></div>
            </a></li>
            <li><a class="project" href="https://github.com/Timbuhtuk/BetweenTwoWorlds" target="_blank" rel="noopener noreferrer" data-project="btw" aria-label="Between Two Worlds — game in development. Open private GitHub repository in a new tab.">
                <span class="project-number">03</span><div class="project-name"><h2>Between Two Worlds</h2></div><span class="project-stack" role="img" aria-label="C++ / Unreal Engine" title="C++ / Unreal Engine"><img src="assets/technology-logos/svg/cplusplus.svg" alt="" title="C++" width="26" height="26" draggable="false"><img src="assets/technology-logos/svg/unreal-engine.svg" alt="" title="Unreal Engine" width="26" height="26" draggable="false"></span><span class="project-arrow" aria-hidden="true">↗</span>
                <div class="inline-preview btw-inline" data-btw-mount role="img" aria-label="Between Two Worlds: actual gameplay captures of the forest, wildlife by the water and a campfire clearing"><img class="btw-fallback" src="assets/work/btw/gameplay.png" alt="Between Two Worlds forest gameplay" width="1920" height="1080" draggable="false"></div>
            </a></li>
            <li><a class="project" href="https://timbuhtuk.github.io/sidequest/" target="_blank" rel="noopener noreferrer" data-project="sidequest" aria-label="SIDEQUEST — achievement trackers. Open the live site in a new tab.">
                <span class="project-number">04</span><div class="project-name"><h2>SIDEQUEST</h2></div><span class="project-stack" role="img" aria-label="TypeScript / React" title="TypeScript / React"><img src="assets/technology-logos/svg/typescript.svg" alt="" title="TypeScript" width="26" height="26" draggable="false"><img src="assets/technology-logos/svg/react.svg" alt="" title="React" width="26" height="26" draggable="false"></span><span class="project-arrow" aria-hidden="true">↗</span>
                <div class="inline-preview sidequest-inline" data-sidequest-mount role="img" aria-label="SIDEQUEST: published homepage background with the game library and Deus Ex TF29 Headquarters map"><img class="sidequest-fallback" src="assets/work/sidequest/home.jpg" alt="SIDEQUEST homepage" width="1280" height="720" draggable="false"></div>
            </a></li>
            <li><a class="project" href="https://github.com/Timbuhtuk/Kvasir" target="_blank" rel="noopener noreferrer" data-project="kvasir" aria-label="Kvasir — Discord music bot. Open GitHub in a new tab.">
                <span class="project-number">05</span><div class="project-name"><h2>Kvasir</h2></div><span class="project-stack" role="img" aria-label="C# / .NET / SQLite" title="C# / .NET / SQLite"><img src="assets/technology-logos/svg/csharp.svg" alt="" title="C#" width="26" height="26" draggable="false"><img src="assets/technology-logos/svg/dotnet.svg" alt="" title=".NET" width="26" height="26" draggable="false"></span><span class="project-arrow" aria-hidden="true">↗</span>
                <img class="inline-preview" src="assets/work/kvasir.svg" alt="Illustrated music bot queue and playback controls" width="720" height="480" draggable="false">
            </a></li>
        </ol>
    </main>
    <aside class="project-preview" aria-hidden="true">
        <div class="preview-art">
            <div data-image="tessera" class="preview-scene" data-tessera-mount><img class="tessera-fallback" src="assets/work/tessera/editor-color.png" alt="" width="1220" height="880" draggable="false"></div>
            <div data-image="sonar" class="preview-scene" data-sonar-mount><img class="sonar-fallback" src="assets/work/sonar/brand.png" alt="" width="785" height="438" draggable="false"></div>
            <div data-image="btw" class="preview-scene" data-btw-mount><img class="btw-fallback" src="assets/work/btw/gameplay.png" alt="" width="1920" height="1080" draggable="false"></div>
            <div data-image="sidequest" class="preview-scene" data-sidequest-mount><img class="sidequest-fallback" src="assets/work/sidequest/home.jpg" alt="" width="1280" height="720" draggable="false"></div>
            <img data-image="kvasir" src="assets/work/kvasir.svg" alt="" width="720" height="480" draggable="false">
        </div>
    </aside>
    <template id="tessera-preview-template">
        <div class="tessera-scene">
            <div class="tessera-artwork">
                <img class="tessera-original" src="assets/work/tessera/mural-original.png" alt="" width="640" height="640" draggable="false">
                <img class="tessera-processed" src="assets/work/tessera/mural-pixel.png" alt="" width="640" height="640" draggable="false">
            </div>
            <div class="tessera-shade" aria-hidden="true"></div>
            <div class="tessera-wordmark"><img src="assets/work/tessera/app-icon.png" alt="" width="64" height="64" draggable="false"><span>TESSERA</span></div>
            <div class="tessera-shot preview-shot preview-shot--back"><img src="assets/work/tessera/editor-light.png" alt="" width="1220" height="880" draggable="false"></div>
            <div class="tessera-shot preview-shot preview-shot--front"><img src="assets/work/tessera/editor-color.png" alt="" width="1220" height="880" draggable="false"></div>
        </div>
    </template>
    <template id="sonar-preview-template">
        <div class="sonar-scene">
            <div class="sonar-orbit" aria-hidden="true"></div>
            <div class="sonar-wordmark"><img src="assets/work/sonar/brand.png" alt="" width="785" height="438" draggable="false"></div>
            <div class="sonar-screen sonar-screen--search"><img src="assets/work/sonar/search.jpg" alt="" width="370" height="771" draggable="false"></div>
            <div class="sonar-screen sonar-screen--home"><img src="assets/work/sonar/home.jpg" alt="" width="370" height="770" draggable="false"></div>
            <div class="sonar-screen sonar-screen--favorites"><img src="assets/work/sonar/favorites.png" alt="" width="376" height="771" draggable="false"></div>
        </div>
    </template>
    <template id="btw-preview-template">
        <div class="btw-scene">
            <img class="btw-gameplay" src="assets/work/btw/gameplay.png" alt="" width="1920" height="1080" draggable="false">
            <div class="btw-shade" aria-hidden="true"></div>
            <div class="btw-title">BETWEEN TWO<br>WORLDS</div>
            <div class="btw-shot preview-shot preview-shot--back"><img src="assets/work/btw/gameplay-wildlife.png" alt="" width="1920" height="1080" draggable="false"></div>
            <div class="btw-shot preview-shot preview-shot--front">
                <img src="assets/work/btw/gameplay-campfires.png" alt="" width="1920" height="1080" draggable="false">
            </div>
        </div>
    </template>
    <template id="sidequest-preview-template">
        <div class="sidequest-scene">
            <img class="sidequest-home" src="assets/work/sidequest/home.jpg" alt="" width="1280" height="720" draggable="false">
            <div class="sidequest-shade" aria-hidden="true"></div>
            <div class="sidequest-wordmark"><img src="assets/work/sidequest/home.jpg" alt="" width="1280" height="720" draggable="false"></div>
            <div class="sidequest-map preview-shot preview-shot--back"><img src="assets/work/sidequest/map.jpg" alt="" width="1280" height="720" draggable="false"></div>
            <div class="sidequest-library preview-shot preview-shot--front"><img src="assets/work/sidequest/library.jpg" alt="" width="1280" height="720" draggable="false"></div>
        </div>
    </template>
</body>
</html>
